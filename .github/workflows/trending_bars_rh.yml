name: trending-bars-rh

# Minute price paths for ROBINHOOD CHAIN (id 4663), the second chain in this study.
#
# Same collector as trending-bars, pointed at a different GeckoTerminal network. Verified live
# 2026-09-01: /networks/robinhood/tokens/multi/ resolved 30/30 board mints to pools
# (uniswap-v4-robinhood, pons-v2-dex, bankr-robinhood, reserves $15k-$149k) and
# /pools/<addr>/ohlcv/minute returned 1,000 bars current to the minute.
#
# This UNBLOCKS ALL OUTCOME MEASUREMENT on Robinhood. Until it runs, the only Robinhood return that
# can be computed is a board-to-board price change, which is measurable ONLY while a token is still
# trending -- exactly the survivorship trap that made Solana's board-only reading (+162.6% mean at
# 3h) differ from the bar-based truth (-16% to -49%) by ~180 points. The 2,467 mints of board
# history already collected are fully backfillable: GeckoTerminal serves complete OHLCV with
# before_timestamp paging.
on:
  schedule:
    # THREE slots, not one. A single hourly slot means one dropped scheduled event is a full
    # hour idle -- measured 2026-09-01, the 19:10 and 20:10 slots were both dropped after a cancel and
    # Robinhood bar collection sat dead for 2.5h with nothing recording it (C0f). Extra slots are
    # free: with cancel-in-progress:false GitHub keeps at most one pending run and drops the rest,
    # so they change nothing while a run is active and only matter when the job is idle -- which is
    # precisely the case that failed. Offset from trending-bars (:00,:20,:40) so the two never
    # start together.
    - cron: '10,30,50 * * * *'
  workflow_dispatch: {}

concurrency:
  # Its OWN group, not shared with trending-bars. Sharing a group with a 5h job is what starved
  # materialize-paths to zero runs in 5.1 hours on 2026-08-31.
  group: trending-bars-rh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GT_NETWORK: 'robinhood'
          SOL_SOURCES: 'gmgn_rh'
          # CONTROL ARM, live since 2026-09-01. `rh_universe.py` supplies the population at risk
          # (85.7% recall against the board, `rh_universe.py --audit`), so this run can finally
          # collect bars for tokens that did NOT trend. Until now every Robinhood bar belonged to a
          # token that already had, which makes "which token is about to trend" unanswerable: a
          # model fit on cases alone learns "is this token alive" (E1).
          #
          # CONTROL_SOURCE must track GT_NETWORK. pump_launches and candidate_universe carry no
          # chain column, so leaving it at the default would queue base58 Solana mints on a
          # Robinhood run -- each one failing wrong_chain() and burning budget. Same failure mode
          # SOL_SOURCES prevents on the case side.
          #
          # Before switching this on, prune_trending_bars was taught about rh_launches. Its orphan
          # delete removes bars for any mint absent from every population table, and a Robinhood
          # control appears in none of the Solana ones -- so the pruner would have silently deleted
          # this entire arm on every run (A13).
          UNIVERSE_FRAC: '0.4'
          CONTROL_SOURCE: 'rh_launches'
          # Retention runs from the Solana instance only; prune_trending_bars is global and a
          # full-table delete, so running it from both is contention for nothing.
          PRUNE: '0'
          MAX_CALLS: '2400'
          RUN_SECONDS: '18000'
          SLEEP: '2.1'
          # POST_H / LONG_POST_H deliberately NOT set: they must equal prune_trending_bars'
          # post_h/long_post_h defaults (6 / 24) or the collector re-fetches what the pruner
          # deletes, forever.
        run: python trending_bars.py
