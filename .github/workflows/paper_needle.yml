name: paper-needle

# Paper book for the needle range-order strategy, replayed against the CHAIN swap record
# (tape_prices.py: every V3/V4 Swap log with its own sqrtPriceX96 and block time, bucket shadow-tape
# prefix prices/v2/, extended to head at the start of every pass; the shadow tape supplies USD sizes
# only — guardrail D-PRICE). Write-once: each pass finalizes only fills past its frontier
# (rh_state.paper_needle_final_ts) and loads LOOKBACK_H warm-up hours for state, so a killed pass
# loses nothing and cancel-in-progress is safe. Self-polls every PASS_INTERVAL inside RUN_SECONDS;
# the cron is a restart heartbeat (C2: GitHub dropped 4 of 5 hourly slots on 2026-09-10).
# Spec: research/needle-lp-forward-test.md (this book evaluates nothing).
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch: {}

concurrency:
  group: paper-needle
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}   # block timestamps (the public node returns 0)
          LOOKBACK_H: '2'
          RUN_SECONDS: '18000'
          PASS_INTERVAL: '1200'
        run: python paper_needle.py
