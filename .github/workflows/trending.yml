name: trending

# Polls the fomo trending board into `trending_snapshots`. Same self-poll pattern
# as `sample`: GitHub throttles frequent schedules, so each job self-polls for
# ~5.5h (one board pull every PASS_INTERVAL seconds) and the cron is only a
# restart heartbeat. concurrency keeps exactly one job running -> continuous
# coverage regardless of how erratically the schedule fires.
#
# CRON DISABLED 2026-09-03 — the fomoscan pilot quota is exhausted (`unitsRemaining=0`), so every
# run has printed "QUOTA EXHAUSTED at startup — exiting" and written nothing since 2026-08-27
# (238 rows, the whole table). It exits 0, so the workflow list showed five green runs a day for a
# feed that had been dead six days: exactly the "verify feeds are alive before trusting a label"
# case, since board labels take the EARLIEST sighting across boards. At */10 this was 144 scheduled
# dispatches a day — the single highest-frequency cron in the repo — spent on that no-op, while
# materialize-paths was landing ~2% of its own */20 slots. GeckoTerminal (`trending-gt`) already
# stands in for this board. Re-enable the cron by uncommenting when the quota is topped up;
# workflow_dispatch still works for a manual check.
on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: trending
  cancel-in-progress: false    # queue behind the running job; never interrupt it

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # ~5.5h; under the 6h hosted-runner cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOMOSCAN_KEY: ${{ secrets.FOMOSCAN_KEY }}
          RUN_SECONDS: '20000'    # self-poll ~5.5h per job
          PASS_INTERVAL: '900'    # one board pull every 15 min (~72k CU/mo)
        run: python trending.py
