name: trending-gt

# GeckoTerminal trending-pools poller (free substitute for the fomoscan board).
# Same self-poll pattern as `sample`/`trending`: each job self-polls ~5.5h, the cron
# is only a restart heartbeat, concurrency keeps one job running. GeckoTerminal is
# free/keyless (~30 req/min) so we poll every 5 min — finer entry resolution than the
# fomoscan board. Writes trending_snapshots with source='geckoterminal'.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  # cancel-in-progress: TRUE on the board pollers, deliberately.
  #
  # These feeds cannot be backfilled, and `false` kept losing them. A run holds the group for its
  # whole RUN_SECONDS; GitHub keeps at most one pending run per group and drops the others, and
  # when the run finally ends the scheduler does not reliably start a fresh one -- measured
  # 2026-08-31: trending-gmgn-rh ended 21:20 and had produced NO new run by 22:53 (three cron slots
  # missed, 93 minutes of board data gone); trending-st the same, 76 minutes. Reducing cron
  # frequency was tried first on a scheduler-pressure hypothesis and did NOT fix it.
  #
  # With `true`, every cron slot starts a fresh run and kills the old one, so a restart cannot be
  # dropped by pending-run bookkeeping. The poll cadence is unchanged: each job polls immediately at
  # startup and then every PASS_INTERVAL, so a 30-minute lifetime still yields the same 15/5-minute
  # cadence. The cost is ~45s of runner setup per restart, which is the right price for a feed that
  # is gone forever if missed.
  group: trending-gt
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RUN_SECONDS: '20000'
          PASS_INTERVAL: '300'    # one board pull every 5 min (free, no quota)
        run: python trending_gt.py
