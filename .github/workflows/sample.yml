name: sample

on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes (GitHub cron minimum granularity)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: sample
  cancel-in-progress: false    # never interrupt a run mid-window

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RUN_SECONDS: '270'
          PASS_INTERVAL: '30'
        run: python worker.py
