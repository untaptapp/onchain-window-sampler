name: materialize-paths

# Bar-resolution path outcomes -> trending_paths, so raw minute bars become droppable.
# Bars grow ~59 MB/day and are unbounded in mint count; one path row is ~508 B and stands in for
# ~45 kB of bars (~90x). Runs often enough that a mint's outcomes are captured well before any
# retention window could reach its bars.
#
# KEEP_DAYS is the bar-retention switch and defaults to 0 (OFF) on purpose. Turning it on trades
# the ability to backtest a NOT-YET-INVENTED exit rule for storage runway -- which is exactly the
# trade that POST_H=3 made silently and wrongly. Set it deliberately.
on:
  schedule:
    # Hourly, not 2-hourly. GitHub silently DROPS scheduled runs under load -- this job missed both
    # its 00:25 and 02:25 slots on 2026-08-30, leaving the forward-test sample stale by 4h with no
    # error anywhere. Materialisation is the only thing that turns bars into evaluable outcomes, so
    # a missed run directly delays the pre-registered test. Hourly gives the schedule slack to
    # absorb a dropped slot; the job is idempotent and cheap.
    # */20, not hourly. Hourly was chosen to "give the schedule slack to absorb a dropped slot",
    # but GitHub drops them in runs, not singly: on 2026-09-01 the 01:25 AND 02:25 slots produced no
    # run at all -- not cancelled, not queued, simply never created, with the concurrency group free
    # and only 11 of a 20-job limit in use. I cannot explain why GitHub skipped them, so the answer
    # is redundancy rather than a diagnosis: three slots an hour means two can vanish and scoring
    # still advances. The job is idempotent and takes ~6 minutes, so extra slots cost nothing.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Drop bars for mints materialised more than N days ago (0 = never)'
        default: '0'

concurrency:
  # Its OWN group. A group shared with trending-bars starved this job completely -- see the note
  # there. This one must keep its hourly slot: it is the only thing that turns bars into scored
  # trades, so every hour it misses is an hour the pre-registered forward test does not advance.
  group: materialize-paths
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days || '0' }}
        run: python materialize_paths.py
      # Robinhood is a SEPARATE step, not an extra call inside materialize_paths.py, and it runs
      # even when the Solana step fails. The two share no code: the Solana path needs SOL
      # denomination and Jupiter quotes, which do not exist on this chain. Before this existed
      # trending_paths held ZERO EVM rows -- every derived return in the project was Solana-only.
      - name: run-robinhood
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python materialize_rh.py
