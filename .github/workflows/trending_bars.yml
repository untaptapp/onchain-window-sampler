name: trending-bars

# Minute-resolution price paths — the backtest substrate.
# Board feeds sample at 5/15/30 min, far too coarse to evaluate an exit rule (a 20% trailing stop
# "fired" on only 6% of snapshot paths purely because a 30-min gap cannot see the drawdown).
# Minute bars carry HIGH/LOW — the prices a stop actually touches. GeckoTerminal's OHLCV endpoint
# is free and supports before_timestamp paging, so this BACKFILLS existing history as well as
# extending it forward. Resumable: least-covered mints first, budgeted per run.
on:
  schedule:
    # Three slots so a dropped scheduled event costs 20 minutes, not an hour (C0f). Offset from
    # trending-bars-rh (:10,:30,:50).
    - cron: '0,20,40 * * * *'
  workflow_dispatch: {}

concurrency:
  # NOT shared with materialize-paths. Sharing a group was tried and made things worse: this job
  # runs for RUN_SECONDS=18000 (5h) and its own cron re-queues it hourly, so it holds the group
  # continuously. GitHub keeps at most ONE pending run per group and DROPS the rest, so
  # materialize-paths went from failing sometimes to not running at all — zero runs in 5.1 hours,
  # nothing queued, nothing cancelled, no error anywhere. The contention it was meant to fix is
  # addressed at the source instead: load_entries no longer reads control-arm bars (a 2.1x cut).
  group: trending-bars
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The materialize (scoring) step that ran here was REMOVED 2026-09-27 along with the
      # materialize-paths, trending-analyze and trending-quotes workflows (all disabled). Each run
      # re-downloaded every Solana snapshot (with `extra`) and every entry mint's minute bars —
      # ~1 GB — and had grown from ~6 min to 1-5 h, running near-continuously across two jobs.
      # That drove Supabase egress to 722 GB / 250 GB (289%) and a Fair Use grace period. The
      # Solana front-run thread concluded NO-GO 2026-09-06. If scoring is ever revived, make
      # load_entries incremental first; do not restore this full re-read.
      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # PRUNE=0 since 2026-09-03. prune_trending_bars deletes a MEASURED ZERO rows -- both
          # halves: the window delete is structurally empty because the collector and the pruner
          # agree on [lo-pre_h, hi+ph] (C0c), and the orphan delete is empty because every mint
          # with bars is in one of the four population tables. It nonetheless scans 2.4M rows for
          # >60s and dies on Supabase's GATEWAY timeout -- 60s, independent of the 120s
          # statement_timeout, so raising that would not have helped -- which sb() then retried
          # four times, spending ~4 min of every pass and printing "pruned FAILED(0)" forever. A
          # permanently-red line in a healthy log is worse than no line: it teaches you to skip it.
          # Storage does not bind: 1.34 GB of 8 GB, ~55 MB/day, ~120 days of runway. If it ever
          # does, the deliberate lever is KEEP_DAYS in materialize-paths (see C0d) -- and this
          # function needs chunking before it can run through PostgREST at all.
          PRUNE: '0'
          MAX_CALLS: '2400'
          RUN_SECONDS: '18000'
          SLEEP: '2.1'
        run: python trending_bars.py
